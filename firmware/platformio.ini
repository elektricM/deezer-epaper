[env:wifi]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001

; Nothing draws on the device - frames arrive fully rendered - so the vendor's
; GUI_Paint and font tables are left out of the build.
build_src_filter = +<*> -<GUI_Paint.cpp> -<font*.cpp>
